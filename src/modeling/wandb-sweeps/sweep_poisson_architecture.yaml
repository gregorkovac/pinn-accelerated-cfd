program: train.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  model:
    value: "poisson"

  data_path:
    value: "../../../data_simple"

  data_samples:
    value: 20

  samples_per_case:
    value: 32

  model_path:
    value: "../../models"

  epochs:
    value: 500

  batch_size:
    value: 32

  optimizer:
    value: "adam"

  scheduler_gamma:
    value: 0.8

  weight1:
    value: 1

  weight2:
    value: 0

  weight3:
    value: 0

  weight4:
    value: 0

  norm:
    value: "none"

  wandb:
    value: true
    
  wandb-project:
    value: "poisson-architecture"

  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2

  use_scheduler:
    values: [true, false]

  scheduler_step:
    values: [50, 100, 200]

  num_layers:
    values: [1, 2, 3, 4, 5, 6, 7, 8]

  hidden_dim:
    values: [8, 16, 32, 64, 128]

  activation:
    values: ["relu", "tanh"]

  architecture:
    values: ["cnn", "encdec"]
  
  pooling:
    values: ["avg", "max", "stride"]

  upsampling:
    values: ["upsample", "convtranspose"]
