program: train.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  model:
    value: "poisson"

  data_path:
    value: "../../../masters_thesis_old/data/generated_data/data/"

  data_samples:
    value: 20

  samples_per_case:
    value: 10

  model_path:
    value: "../../models"

  epochs:
    value: 200

  batch_size:
    value: 30

  optimizer:
    value: "adam"

  use_scheduler:
    value: false

  scheduler_gamma:
    value: 0.8

  scheduler_step:
    value: 50

  weight1:
    value: 1

  weight2:
    value: 0

  weight3:
    value: 0

  weight4:
    value: 0

  wandb:
    value: true
    
  wandb-project:
    value: "poisson-architecture"

  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2

  num_layers:
    values: [1, 2, 3, 4]

  hidden_dim:
    values: [8, 16, 32, 64]

  activation:
    values: ["relu", "tanh"]

  architecture:
    values: ["cnn", "encdec"]
  
  pooling:
    values: ["avg", "max", "stride"]

  upsampling:
    values: ["upsample", "convtranspose"]

  norm:
    values: ["none", "batch", "group"]
