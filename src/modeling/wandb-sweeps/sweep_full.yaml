method: bayes
metric:
  goal: minimize
  name: val_loss
parameters:
  activation:
    value: relu
  architecture:
    value: encdec
  batch_size:
    value: 128
  data_path:
    value: ../../../data_glycerol_large
  data_samples:
    value: 100
  epochs:
    value: 500
  hidden_dim:
    values:
      - 16
      - 32
  lr:
    distribution: log_uniform_values
    max: 0.01
    min: 1e-05
  model:
    value: full
  model_path:
    value: ../../models
  norm:
    value: none
  num_layers:
    values:
    - 3
    - 4
    - 5
    - 6
  optimizer:
    value: adam
  pooling:
    value: stride
  samples_per_case:
    value: 1
  scheduler_gamma:
    values:
      - 0.5
      - 0.7
      - 0.8
      - 0.9
  scheduler_step:
    values:
      - 50
      - 100
      - 200
      - 10000
  upsampling:
    values:
    - upsample
  use_scheduler:
    value: true
  wandb:
    value: true
  wandb-project:
    value: ns-architecture
  weight1:
    value: 100
  weight2:
    value: 1
  weight3:
    value: 0
  weight4:
    value: 0
  skips:
    value: unet
  plot:
    value: false
program: train.py