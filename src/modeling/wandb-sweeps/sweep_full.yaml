program: train.py
method: bayes
metric:
  name: val_loss
  goal: minimize

parameters:
  model:
    value: "full"
  data_path:
    value: "../../data/generated_data_simple/train"
  data_samples:
    value: 15
  samples_per_case:
    value: 1
  model_path:
    value: "../../models"
  epochs:
    value: 50000
  batch_size:
    value: 1000
  optimizer:
    value: "lbfgs"
  use_scheduler:
    value: false
  scheduler_gamma:
    value: 0.8
  scheduler_step:
    value: 50
  wandb:
    value: true
  wandb-project:
    value: "pinn-small"

  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2

  num_layers:
    values: [1, 2, 3, 4]

  hidden_dim:
    values: [16, 32, 64, 128, 256]

  weight1:
    distribution: log_uniform_values
    min: 0.1
    max: 100

  weight2:
    distribution: log_uniform_values
    min: 0.1
    max: 100

  weight3:
    distribution: log_uniform_values
    min: 0.1
    max: 100

  weight4:
    distribution: log_uniform_values
    min: 0.1
    max: 100
