    values:
      - relu
      - silu
      - tanh
  architecture:
    value: encdec
  batch_size:
    value: 32
  data_path:
    value: ../../../data_glycerol_large
  data_samples:
    value: 100
  epochs:
    value: 500
  hidden_dim:
    values:
      - 16
      - 32
  lr:
    distribution: log_uniform_values
    max: 0.005
    min: 1e-05
  model:
    value: full
  model_path:
    value: ../../models
  norm:
    value: none
  num_layers:
    value: 5
  optimizer:
    value: adam
  pooling:
    values:
      - stride
      - avg
      - max
  samples_per_case:
    value: 1
  scheduler_gamma:
    value: 1.0
  scheduler_step:
    value: 0
  upsampling:
    value: upsample
  use_scheduler:
    value: false
  wandb:
    value: true
  wandb-project:
    value: ns-architecture
  weight1:
    value: 1
  weight2:
    value: 1
  weight3:
    value: 0
  weight4:
    value: 0
  skips:
    value: unet
  plot:
    value: false
program: train.py